<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Purrdom - Hyperliquid Cat Kingdom Prototype</title>
    <link rel="icon" href="/assets/generated/tokens/token_purr_points.png">
  </head>
  <body>
    <main id="game-shell" aria-label="Purrdom playable prototype">
      <canvas id="gameCanvas" width="1280" height="720"></canvas>
      <div id="game-ui" aria-live="polite">
        <div id="hud"></div>
        <div id="tooltip" class="tooltip hidden"></div>
        <div id="dialogue" class="dialogue hidden"></div>
        <div id="panel-root"></div>
        <div id="mobile-controls" aria-label="Mobile controls"></div>
      </div>
      <div id="react-root"></div>
      <div id="orientation-gate" aria-live="polite">
        <div class="orientation-message">
          <strong>Rotate to landscape</strong>
          <span>Purrdom plays in landscape on phones.</span>
        </div>
      </div>
      <noscript>Purrdom needs JavaScript enabled.</noscript>
    </main>
    <script type="module" src="/src/react/main.jsx"></script>
  </body>
</html>
